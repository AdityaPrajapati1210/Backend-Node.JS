<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Say</title>
    <style>
        body{
            text-align: center;
            width: 100vw;
        }
        .btn{
            height: 100px;
            width: 100px;
            border: 5px solid black;
            border-radius: 20%;
            margin: 10px;
        }
        .first-line , .second-line{
            display: flex;
        }
        .btn-container{
            width: 250px;
            margin: 0 auto;
        }
        .red{
            background-color: rgb(255, 0, 217);
        }
        .green{
            background-color: rgb(30, 255, 0);
        }
        .blue{
            background-color: rgb(0, 149, 255);
        }
        .yellow{
            background-color: yellow;
        }
        .white{
            background-color: white;
        }

    </style>
</head>
<body>
    <h1>Simon Say Game</h1>
    <h3>Press any key to start the game.</h3>

    <div class="btn-container">
        <div class="first-line">
            <div class="btn red" id="red"></div>
            <div class="btn green" id="green"></div>
        </div>
        <div class="second-line">
            <div class="btn yellow" id="yellow"></div>
            <div class="btn blue" id="blue"></div>
        </div>
    </div>
    <script src="simonSay.js"></script>
</body>
</html>
